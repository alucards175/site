version: '3.8'

services:
  # Nginx Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites-available:/etc/nginx/sites-available
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
      - websocket
    networks:
      - hitmanki-network

  # MySQL Database
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hitmanki_store
      MYSQL_USER: hitmanki
      MYSQL_PASSWORD: hitmanki123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hitmanki-network

  # Redis Cache & Sessions
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hitmanki-network

  # Laravel Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=mysql
      - DB_DATABASE=hitmanki_store
      - DB_USERNAME=hitmanki
      - DB_PASSWORD=hitmanki123
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - php_storage:/var/www/html/storage
    depends_on:
      - mysql
      - redis
    networks:
      - hitmanki-network

  # Node.js WebSocket Server
  websocket:
    build:
      context: ./websocket
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "3001:3001"
    volumes:
      - ./websocket:/app
    depends_on:
      - redis
    networks:
      - hitmanki-network

  # Vue.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - hitmanki-network

  # Laravel Horizon (Queue Management)
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile.horizon
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_DATABASE=hitmanki_store
      - DB_USERNAME=hitmanki
      - DB_PASSWORD=hitmanki123
      - REDIS_HOST=redis
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - hitmanki-network

  # Laravel Scheduler
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile.scheduler
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_DATABASE=hitmanki_store
      - DB_USERNAME=hitmanki
      - DB_PASSWORD=hitmanki123
      - REDIS_HOST=redis
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
      - redis
    networks:
      - hitmanki-network

volumes:
  mysql_data:
  redis_data:
  php_storage:

networks:
  hitmanki-network:
    driver: bridge